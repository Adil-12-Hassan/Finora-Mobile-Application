name: finora
description: "Finora - Personal Finance Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # State Management
  provider: ^6.1.2

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.6.2

  # Charts
  fl_chart: ^0.69.0

  # UI & Utils
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  google_fonts: ^6.2.1
  icons_plus: ^5.0.0              # replaces lucide_icons
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/finora_logo.jpg

path_provider: ^2.1.4
path: ^1.9.0